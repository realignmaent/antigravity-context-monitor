<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';" />
    <title>Antigravity Context</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <header class="titlebar">
        <span class="brand">上下文窗口</span>
        <div class="actions">
          <button id="refresh" title="立即刷新" aria-label="立即刷新">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <path
                d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 1.5v3.2h-3.2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button id="hide" title="隐藏到托盘" aria-label="隐藏到托盘">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <path d="M3 8h10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          </button>
          <button id="quit" title="退出" aria-label="退出">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </header>

      <section class="headline">
        <div class="numbers">
          <span class="used" id="used">—</span>
          <span class="sep">/</span>
          <span class="limit" id="limit">—</span>
          <span class="pct" id="pct"></span>
        </div>
        <div class="bar" id="bar"></div>
      </section>

      <section class="rows" id="rows"></section>
      <section class="pinned" id="pinned"></section>

      <footer class="footer">
        <svg class="spark" id="spark" viewBox="0 0 240 28" preserveAspectRatio="none" aria-hidden="true">
          <path id="sparkArea" d="" />
          <path id="sparkLine" d="" />
        </svg>
        <div class="meta">
          <span id="model">—</span>
          <span id="note"></span>
        </div>
      </footer>

      <div class="empty" id="empty" hidden><span id="emptyText"></span></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
